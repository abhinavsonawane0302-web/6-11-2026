<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">


            <h2 class="text-center bg-info text-white p-2">
                Student Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Percentage</th>
                        <th>Result</th>
                        <th>Email</th>
                        <th>Contact</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let std of studentArr">
                        <td>{{std.rollNo}}</td>
                        <td>{{std.name}}</td>
                        <td>{{std.course}}</td>
                        <td>{{std.year}}</td>
                        <td>{{std.percentage}}</td>
                        <td>{{std.isPassed ? "Pass" : "Fail"}}</td>
                        <td>{{std.email}}</td>
                        <td>{{std.contact}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
