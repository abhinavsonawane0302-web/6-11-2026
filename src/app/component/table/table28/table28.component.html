<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                Company Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Company ID</th>
                        <th>Name</th>
                        <th>Headquarters</th>
                        <th>Employees</th>
                        <th>Founded</th>
                        <th>Revenue (Cr)</th>
                        <th>Is Public</th>
                        <th>Sector</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let company of companyArr">
                        <td>{{company.companyId}}</td>
                        <td>{{company.name}}</td>
                        <td>{{company.headquarters}}</td>
                        <td>{{company.employees}}</td>
                        <td>{{company.founded}}</td>
                        <td>{{company.revenueCr | currency : "INR"}}</td>
                        <td>{{company.isPublic ? "Yes" : "No"}}</td>
                        <td>{{company.sector}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
