<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                Restaurant Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Restaurant ID</th>
                        <th>Name</th>
                        <th>Cuisine</th>
                        <th>City</th>
                        <th>Rating</th>
                        <th>Average Cost</th>
                        <th>Open</th>
                        <th>Veg</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let rest of restaurantArr">
                        <td>{{rest.restId}}</td>
                        <td>{{rest.name}}</td>
                        <td>{{rest.cuisine}}</td>
                        <td>{{rest.city}}</td>
                        <td>{{rest.rating}}</td>
                        <td>{{rest.avgCost | currency : "INR"}}</td>
                        <td>{{rest.isOpen ? "Yes" : "No"}}</td>
                        <td>{{rest.isVeg}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
