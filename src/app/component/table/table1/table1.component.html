

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">


            <h2 class="text-center bg-danger text-white p-2">
                Employee Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Emp ID</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Permanent</th>
                        <th>Email</th>
                        <th>Contact</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let emp of empArr">
                        <td>{{emp.empId}}</td>
                        <td>{{emp.empName}}</td>
                        <td>{{emp.designation}}</td>
                        <td>{{emp.department}}</td>
                        <td>{{emp.salary | currency : "INR"}}</td>
                        <td>{{emp.isPermanent ? "Yes" : "No"}}</td>
                        <td>{{emp.email}}</td>
                        <td>{{emp.contact}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
