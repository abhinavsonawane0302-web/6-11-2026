<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">


            <h2 class="text-center bg-danger text-white p-2">
                Order Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">

                <thead class="thead-dark">
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let order of orderArr">
                        <td>{{order.orderId}}</td>
                        <td>{{order.customerName}}</td>
                        <td>{{order.product}}</td>
                        <td>{{order.amount | currency : "INR"}}</td>
                        <td>{{order.status}}</td>
                        <td>{{order.date}}</td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>
