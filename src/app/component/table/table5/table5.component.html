<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">


            <h2 class="text-center bg-danger text-white p-2">
                Book Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">

                <thead class="thead-dark">
                    <tr>
                        <th>Book ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Pages</th>
                        <th>Available</th>
                        <th>Genre</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let book of bookArr">
                        <td>{{book.bookId}}</td>
                        <td>{{book.title}}</td>
                        <td>{{book.author}}</td>
                        <td>{{book.price | currency : "INR"}}</td>
                        <td>{{book.pages}}</td>
                        <td>{{book.isAvailable ? "Yes" : "No"}}</td>
                        <td>{{book.genre}}</td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>
