<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                Library Member Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Member ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Membership</th>
                        <th>Books Issued</th>
                        <th>Active</th>
                        <th>Join Date</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let member of memberArr">
                        <td>{{member.memberId}}</td>
                        <td>{{member.name}}</td>
                        <td>{{member.age}}</td>
                        <td>{{member.membership}}</td>
                        <td>{{member.booksIssued}}</td>
                        <td>{{member.isActive ? "Yes" : "No"}}</td>
                        <td>{{member.joinDate}}</td>
                        <td>{{member.email}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
