<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                City Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>City ID</th>
                        <th>Name</th>
                        <th>State</th>
                        <th>Population</th>
                        <th>Metro City</th>
                        <th>Pincode</th>
                        <th>Famous For</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let city of cityArr">
                        <td>{{city.cityId}}</td>
                        <td>{{city.name}}</td>
                        <td>{{city.state}}</td>
                        <td>{{city.population}}</td>
                        <td>{{city.isMetro ? "Yes" : "No"}}</td>
                        <td>{{city.pincode}}</td>
                        <td>{{city.famousFor}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
