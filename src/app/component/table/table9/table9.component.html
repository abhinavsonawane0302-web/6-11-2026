<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                Teacher Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">

                <thead class="thead-dark">
                    <tr>
                        <th>Teacher ID</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Experience</th>
                        <th>Salary</th>
                        <th>Full Time</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let teacher of teacherArr">
                        <td>{{teacher.teacherId}}</td>
                        <td>{{teacher.name}}</td>
                        <td>{{teacher.subject}}</td>
                        <td>{{teacher.experience}}</td>
                        <td>{{teacher.salary | currency : "INR"}}</td>
                        <td>{{teacher.isFullTime ? "Yes" : "No"}}</td>
                        <td>{{teacher.email}}</td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>
