<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-info text-white p-2">
                Event Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Event ID</th>
                        <th>Title</th>
                        <th>City</th>
                        <th>Date</th>
                        <th>Ticket Price</th>
                        <th>Seats</th>
                        <th>Sold Out</th>
                        <th>Organizer</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let event of eventArr">
                        <td>{{event.eventId}}</td>
                        <td>{{event.title}}</td>
                        <td>{{event.city}}</td>
                        <td>{{event.date}}</td>
                        <td>{{event.ticketPrice | currency : "INR"}}</td>
                        <td>{{event.seats}}</td>
                        <td>{{event.isSoldOut ? "Yes" : "No"}}</td>
                        <td>{{event.organizer}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
