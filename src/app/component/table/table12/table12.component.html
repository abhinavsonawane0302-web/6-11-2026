<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-info text-white p-2">
                Doctor Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Experience</th>
                        <th>Fees</th>
                        <th>Available</th>
                        <th>Hospital</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let doc of doctorArr">
                        <td>{{doc.doctorId}}</td>
                        <td>{{doc.name}}</td>
                        <td>{{doc.specialization}}</td>
                        <td>{{doc.experience}}</td>
                        <td>{{doc.fees | currency : "INR"}}</td>
                        <td>{{doc.isAvailable ? "Yes" : "No"}}</td>
                        <td>{{doc.hospital}}</td>
                        <td>{{doc.email}}</td>
                    </tr>
                </tbody>
            </table>


        </div>
    </div>
</div>
