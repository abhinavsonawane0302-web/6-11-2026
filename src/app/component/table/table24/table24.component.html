<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">

            <h2 class="text-center bg-danger text-white p-2">
                Subject Details
            </h2>

            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Subject ID</th>
                        <th>Name</th>
                        <th>Subject Code</th>
                        <th>Credits</th>
                        <th>Semester</th>
                        <th>Elective</th>
                        <th>Faculty</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let subject of subjectArr">
                        <td>{{subject.subjectId}}</td>
                        <td>{{subject.name}}</td>
                        <td>{{subject.code}}</td>
                        <td>{{subject.credits}}</td>
                        <td>{{subject.semester}}</td>
                        <td>{{subject.isElective ? "Yes" : "No"}}</td>
                        <td>{{subject.faculty}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
